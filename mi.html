<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kremil RP | Несовместимая ОС</title>
    <meta name="description" content="Информация о поддержке операционных систем для Kremil RP.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --bg-light: #121212;
            --accent: #4a4a4a;
            --highlight: #e0e0e0;
            --text-main: #f0f0f0;
            --text-muted: #888888;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            outline: none; 
            border-radius: 0 !important; /* Строгие прямые углы */
        }
        
        html, body { 
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main); 
            font-family: 'Montserrat', sans-serif; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle, rgba(18,18,18,0) 50%, rgba(5,5,5,1) 100%);
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--bg-light);
            border: 1px solid var(--accent);
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .icon-box {
            font-size: 3rem;
            color: var(--highlight);
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #fff;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .highlight-text {
            color: var(--highlight);
            font-weight: 600;
        }

        .os-badge {
            padding: 16px 30px;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--highlight);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
            cursor: default;
        }

        .os-badge i {
            font-size: 1.2rem;
        }
        
        .footer-note {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #444;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box">
        <i class="fas fa-desktop"></i>
    </div>
    <h1>ОС НЕ ПОДДЕРЖИВАЕТСЯ</h1>
    <p>К сожалению, операционные системы <span class="highlight-text">macOS</span> и <span class="highlight-text">Linux</span> в данный момент не поддерживаются нашим проектом.</p>
    <p>Для корректного запуска лаунчера и комфортной игры на сервере Kremil RP требуется устройство под управлением ОС Windows.</p>
    
    <div class="os-badge">
        <i class="fab fa-windows"></i> ПОДДЕРЖИВАЕТСЯ WINDOWS 10 / 11
    </div>
    
    <div class="footer-note">
        &copy; Kremil RolePlay Project
    </div>
</div>

</body>
</html>
